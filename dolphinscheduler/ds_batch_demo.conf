# =============================================================
# DolphinScheduler 定时调度演示用的 BATCH 冒烟作业
#
# 不读写任何业务库表，FakeSource 生成 3 行后由 Console 输出，跑完即退出，
# 适合在 DS 里配成「每 N 分钟执行一次」的 Shell 工作流。
#
# DS Shell 任务内容：
#   run_seatunnel_job.sh ds_batch_demo.conf local 180
#
# 对比：mysql2doris.conf 是 STREAMING(CDC) 常驻作业，被 DS 定时触发没有意义，
#       这类作业应该用 ST_BACKGROUND=1 启动一次并让它常驻。
# =============================================================
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 3
    schema {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "fake"
  }
}
