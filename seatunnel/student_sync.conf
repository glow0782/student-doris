env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}
source {
  MySQL-CDC {
    startup.mode = "initial"
    username = "st_user_source"
    password = "mysqlpw"
    table-pattern = "student_management\\..*"
    base-url = "jdbc:mysql://mysql:3306/student_management"
  }
}
transform {
  # 可选方案A（稳妥优先）：用TableRename插件统一加ods前缀，兼容性最好，2.3.9稳定
  TableRename {
    prefix = "ods_"
  }
}
sink {
  Doris {
    fenodes = "doris-fe:8030"
    database = "student_sync"
    username = "root"
    password = "000000"
    sink.enable-delete = true
    sink.enable-2pc = true   # 【关键】CDC删除、schema演化、占位符路由必备
    table = "${table_name}"  # 经过TableRename转换后，table_name自动带上ods_前缀

    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
    sink.properties.enable_unique_key_merge_on_write = "true"

    doris.config = {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
